<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disha Vacations | Your AI Travel Partner</title>
    <style>
        /* Reset and layout base optimization */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; /* Prevents double scrollbars when the iframe loads */
            background-color: #f5f7fa; /* Matches Dify's clean app canvas */
            display: flex;
            flex-direction: column;
        }

        /* Elegant branding top bar */
        .header-bar {
            background-color: #0d1b2a; /* Deep, professional travel blue */
            color: #ffffff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 10;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-logo span {
            color: #e0a96d; /* Warm vacation accent gold */
        }

        .status-badge {
            background-color: rgba(224, 169, 109, 0.2);
            border: 1px solid #e0a96d;
            color: #e0a96d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Full-screen iframe container panel */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header class="header-bar">
        <div class="brand-logo">
            🌐 Disha<span>Vacations</span>
        </div>
        <div class="status-badge">
            AI Planner Online
        </div>
    </header>

    <main class="iframe-container">
        <iframe
            src="https://ai.disha.vacations/chatbot/Bepp78wAVL6pDfHu"
            allow="microphone; clipboard-write"
            title="Disha Vacations AI Assistant">
        </iframe>
    </main>

</body>
</html>
